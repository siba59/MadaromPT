<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dipartimento Madarom</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --nero: #0a0a0a;
  --nero-card: #111;
  --nero-border: #1e1e1e;
  --grigio-scuro: #2a2a2a;
  --grigio-mid: #555;
  --grigio-testo: #888;
  --bianco: #f0ede8;
  --bianco-dim: #c8c4bc;
  --oro: #c9a84c;
  --verde: #3a7a3a;
  --rosso: #c0392b;
  --r: 5px;
  --fw: 'Playfair Display', Georgia, serif;
  --fb: 'IBM Plex Sans', sans-serif;
  --fm: 'IBM Plex Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body { height: 100%; background: var(--nero); color: var(--bianco); font-family: var(--fb); font-size: 15px; line-height: 1.6; }
.nascosto { display: none !important; }

/* LOGIN */
#login-screen {
  display: flex; align-items: center; justify-content: center; height: 100%;
  background: var(--nero);
  background-image: radial-gradient(ellipse at 50% 25%, #1a1200 0%, transparent 65%);
}
.login-box { width: 320px; padding: 48px 32px 40px; border: 1px solid #2a2400; background: var(--nero-card); text-align: center; }
.login-logo { font-size: 2.2rem; margin-bottom: 14px; }
.login-title { font-family: var(--fw); font-size: 1.75rem; color: var(--oro); line-height: 1.15; margin-bottom: 6px; }
.login-sub { font-family: var(--fm); font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: var(--grigio-testo); margin-bottom: 32px; }
#login-form input { width: 100%; background: var(--grigio-scuro); border: 1px solid var(--nero-border); color: var(--bianco); padding: 12px 16px; font-family: var(--fm); font-size: .9rem; margin-bottom: 12px; outline: none; transition: border-color .2s; }
#login-form input:focus { border-color: var(--oro); }
#login-btn { width: 100%; background: var(--oro); color: var(--nero); border: none; padding: 12px; font-family: var(--fm); font-size: .82rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
#login-btn:disabled { opacity: .45; cursor: not-allowed; }
#login-error { color: var(--rosso); font-family: var(--fm); font-size: .75rem; margin-top: 10px; min-height: 1.2em; }

/* APP - layout fisso */
#app-screen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
}

/* TOPBAR */
#topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--nero-card);
  border-bottom: 1px solid var(--nero-border);
  flex-shrink: 0;
}
.topbar-logo { font-size: 1.1rem; flex-shrink: 0; }
.topbar-title { font-family: var(--fw); font-size: .9rem; color: var(--oro); font-weight: 700; flex-shrink: 0; }
#agente-select {
  flex: 1;
  min-width: 0;
  background: var(--grigio-scuro);
  border: 1px solid var(--nero-border);
  color: var(--bianco);
  padding: 7px 10px;
  font-family: var(--fb);
  font-size: .82rem;
  border-radius: var(--r);
  outline: none;
}
#agente-select:focus { border-color: var(--oro); }
#btn-sintesi {
  background: transparent;
  border: 1px solid #4a3800;
  color: var(--oro);
  padding: 6px 10px;
  border-radius: var(--r);
  font-family: var(--fm);
  font-size: .68rem;
  cursor: pointer;
  flex-shrink: 0;
  white-space: nowrap;
}
#btn-sintesi:disabled { opacity: .35; cursor: not-allowed; }
#reset-btn {
  background: none;
  border: 1px solid var(--grigio-scuro);
  color: var(--grigio-testo);
  width: 30px; height: 30px;
  border-radius: 50%;
  cursor: pointer;
  font-size: .9rem;
  flex-shrink: 0;
}

/* CONVERSAZIONE - scorre */
#conversazione {
  flex: 1;
  overflow-y: auto; height: 0;;
  overflow-x: hidden;
  padding: 20px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  -webkit-overflow-scrolling: touch;
}
#conversazione::-webkit-scrollbar { width: 3px; }
#conversazione::-webkit-scrollbar-thumb { background: var(--grigio-scuro); }

.msg-benvenuto { max-width: 480px; margin: 32px auto 0; text-align: center; padding: 32px 24px; border: 1px solid var(--nero-border); background: var(--nero-card); }
.msg-benvenuto h2 { font-family: var(--fw); font-size: 1.4rem; color: var(--oro); margin-bottom: 8px; }
.msg-benvenuto p { color: var(--grigio-testo); font-size: .85rem; line-height: 1.6; }

.bolla-utente { align-self: flex-end; max-width: 80%; background: var(--grigio-scuro); border: 1px solid #333; padding: 10px 16px; border-radius: var(--r); font-size: .88rem; color: var(--bianco); word-wrap: break-word; }

.bolla-agente { align-self: flex-start; width: 100%; background: var(--nero-card); border: 1px solid var(--nero-border); border-left: 3px solid var(--verde); border-radius: var(--r); overflow: hidden; word-wrap: break-word; }
.bolla-agente.bolla-sintesi { border-left-color: var(--oro); }

.agente-header { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--nero-border); background: rgba(255,255,255,.02); }
.agente-emoji { font-size: 1rem; flex-shrink: 0; }
.agente-nome { font-size: .8rem; font-weight: 500; color: var(--bianco); }
.agente-ruolo { font-family: var(--fm); font-size: .62rem; color: var(--grigio-testo); margin-top: 1px; }

.agente-contenuto { padding: 14px 16px; font-size: .87rem; line-height: 1.75; color: var(--bianco-dim); }
.agente-contenuto p { margin-bottom: 12px; }
.agente-contenuto p:last-child { margin-bottom: 0; }

.msg-sistema { align-self: center; font-family: var(--fm); font-size: .65rem; color: var(--grigio-testo); }
.indicatore-scrittura { align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--nero-card); border: 1px solid var(--nero-border); border-radius: var(--r); font-family: var(--fm); font-size: .7rem; color: var(--grigio-testo); }
.puntini { display: flex; gap: 4px; }
.puntini span { width: 5px; height: 5px; background: var(--oro); border-radius: 50%; animation: pulsa 1.2s ease-in-out infinite; }
.puntini span:nth-child(2) { animation-delay: .2s; }
.puntini span:nth-child(3) { animation-delay: .4s; }
@keyframes pulsa { 0%,80%,100% { opacity:.2; transform:scale(.8); } 40% { opacity:1; transform:scale(1); } }

/* INPUT - fisso in fondo */
#input-area {
  flex-shrink: 0;
  border-top: 1px solid var(--nero-border);
  padding: 12px 14px;
  background: var(--nero-card);
}
#chat-form { display: flex; gap: 8px; align-items: flex-end; }
#domanda-input {
  flex: 1;
  background: var(--grigio-scuro);
  border: 1px solid var(--nero-border);
  color: var(--bianco);
  padding: 10px 14px;
  font-family: var(--fb);
  font-size: .88rem;
  resize: none;
  outline: none;
  border-radius: var(--r);
  min-height: 42px;
  max-height: 120px;
  transition: border-color .2s;
  -webkit-appearance: none;
}
#domanda-input:focus { border-color: var(--oro); }
#domanda-input::placeholder { color: var(--grigio-mid); }
#invia-btn {
  background: var(--oro);
  color: var(--nero);
  border: none;
  width: 42px; height: 42px;
  border-radius: var(--r);
  font-size: 1.1rem;
  font-weight: bold;
  cursor: pointer;
  flex-shrink: 0;
}
#invia-btn:disabled { opacity: .38; cursor: not-allowed; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🟡</div>
    <h1 class="login-title">Dipartimento<br>Madarom</h1>
    <p class="login-sub">Accesso riservato</p>
    <form id="login-form" autocomplete="off">
      <input type="password" id="password-input" placeholder="Password" autocomplete="current-password"/>
      <button type="submit" id="login-btn">Entra</button>
      <p id="login-error"></p>
    </form>
  </div>
</div>

<div id="app-screen" class="nascosto">
  <div id="topbar">
    <span class="topbar-logo">🟡</span>
    <span class="topbar-title">Madarom</span>
    <select id="agente-select">
      <optgroup label="💎 Pensatori">
        <option value="maestro_allenatore">⚽ Maestro Allenatore PT</option>
        <option value="filosofo">🌍 Filosofo</option>
        <option value="pedagogista">📚 Pedagogista</option>
        <option value="tuttologo">🧭 Tuttologo</option>
        <option value="neuroscienziato">🧠 Neuroscienziato</option>
      </optgroup>
      <optgroup label="⚡ Specialisti">
        <option value="tattico">♟️ Tattico</option>
        <option value="tecnico">🎯 Tecnico</option>
        <option value="fisiologo">🏃 Fisiologo</option>
        <option value="psicologo">🧘 Psicologo</option>
        <option value="matematico">📐 Matematico</option>
        <option value="economista">💼 Economista</option>
        <option value="traduttore">🌐 Traduttore</option>
        <option value="web_editor">✍️ Web Editor</option>
      </optgroup>
      <optgroup label="──────────">
        <option value="direttore">🔮 Visione insieme</option>
      </optgroup>
    </select>
    <button id="btn-sintesi" class="nascosto">🔮 Sintesi</button>
    <button id="reset-btn" title="Nuova conversazione">↺</button>
  </div>

  <div id="conversazione">
    <div class="msg-benvenuto">
      <h2>Dipartimento Madarom</h2>
      <p>Scegli un agente dal menu, scrivi la domanda e premi →</p>
    </div>
  </div>

  <div id="input-area">
    <form id="chat-form">
      <textarea id="domanda-input" placeholder="Scrivi la tua domanda…" rows="1"></textarea>
      <button type="submit" id="invia-btn">→</button>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
